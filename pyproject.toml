[project]
name = "fedorch"
version = "0.1.0"
description = "Federated tool orchestration for edge-AI drone inspection"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.6",
    "torchvision>=0.21",
    "transformers==5.17.0",
    "peft>=0.17",
    "accelerate>=1.0",
    "bitsandbytes>=0.45; sys_platform == 'linux'",
    "huggingface-hub>=0.34",
    "flwr[simulation]>=1.20",
    "nano-jev>=1.0",
    "laya",
    "numpy>=1.26",
    "pandas>=2.2",
    "pillow>=10.0",
    "requests>=2.31",
    "tqdm>=4.66",
]

[project.optional-dependencies]
gpu-tools = ["ultralytics==8.4.208"]
select = [
    "datasets>=5.2.0",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.9.1",
    "trl>=1.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fedorch"]

[tool.uv.sources]
torch = { index = "pytorch-cu126", marker = "sys_platform == 'linux'" }
torchvision = { index = "pytorch-cu126", marker = "sys_platform == 'linux'" }
laya = { git = "https://github.com/r33drichards/laya-vision", rev = "9e1e2419d855ad3e1a2af4d4bd1ef6be5418842c" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
