[project]
name = "fedorch"
version = "0.1.0"
description = "Federated tool orchestration for edge-AI drone inspection"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.6",
    "torchvision>=0.21",
    "transformers>=4.56",
    "peft>=0.17",
    "accelerate>=1.0",
    "huggingface-hub>=0.34",
    "flwr[simulation]>=1.20",
    "nano-jev>=1.0",
    "laya>=0.4",
    "numpy>=1.26",
    "pandas>=2.2",
    "pillow>=10.0",
    "requests>=2.31",
    "tqdm>=4.66",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fedorch"]

[tool.uv.sources]
torch = { index = "pytorch-cu126", marker = "sys_platform == 'linux'" }
torchvision = { index = "pytorch-cu126", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
